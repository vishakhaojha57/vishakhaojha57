name: Profile Animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vishakhaojha57
          outputs: |
            dist/github-snake-dark.svg?color_dots=#2d3343,#A78BFA,#7C3AED,#10B981,#22D3EE&color_snake=#F75C7E
            dist/github-snake-light.svg?color_dots=#e8e8e8,#7C3AED,#A78BFA,#10B981,#0891B2&color_snake=#F75C7E

      - name: Push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-3d-contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: vishakhaojha57
      - name: Commit and push 3D graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "generate 3d contribution graph" || exit 0
          git push
